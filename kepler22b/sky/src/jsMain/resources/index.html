<meta charset="utf-8">
<title>케플러-22b</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@200;300;500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
  /* A star atlas laid over the windshield: the sky is the page; type sits on it directly like chart labels,
     one ruled control strip runs along the bottom, details open as a ruled sheet on the right.
     One look by design (it is a night sky), so there is no light theme. */
  :root {
    color-scheme: dark;
    --sky: #04060c;
    --paper: #ece5d3;          /* chart-paper ivory: text, rules, the one filled control */
    --paper-dim: #a49e90;
    --paper-faint: rgba(236, 229, 211, 0.22);
    --sheet: rgba(5, 8, 16, 0.9);
    --on-paper: #0b0f1a;
    --display: "Hahmlet", "Nanum Myeongjo", "AppleMyungjo", serif;
    --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --gl: max(16px, env(safe-area-inset-left, 0px));
    --gr: max(16px, env(safe-area-inset-right, 0px));
    --gb: env(safe-area-inset-bottom, 0px);
    --ease: cubic-bezier(.2, .7, .2, 1);
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--sky);
    color: var(--paper);
    font: 16px/1.55 var(--body);
    padding-left: var(--gl);
    padding-right: var(--gr);
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible { outline: 1px solid var(--paper); outline-offset: 4px; }

  #sky {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block; touch-action: none; cursor: grab;
    opacity: 0; transition: opacity 1.6s var(--ease);
  }
  #sky.ready { opacity: 1; }
  #sky:active { cursor: grabbing; }
  #loading {
    position: fixed; inset: 0; display: grid; place-content: center;
    font: 300 20px var(--display); color: var(--paper-dim); letter-spacing: .08em;
    animation: breathe 2.4s ease-in-out infinite;
  }
  @keyframes breathe { 50% { opacity: .35; } }

  /* Soft shade behind the corner text so it reads over the Milky Way. */
  .shade {
    position: fixed; pointer-events: none; z-index: 0;
    inset: 0 auto auto 0; width: 520px; height: 260px;
    background: radial-gradient(ellipse at 0 0, rgba(4, 6, 12, .75), transparent 70%);
  }
  .shade.bottom {
    inset: auto 0 0 0; width: auto; height: 160px;
    background: linear-gradient(to top, rgba(4, 6, 12, .92), transparent);
  }

  /* Time and place, set like a chart's title block. */
  .when {
    position: fixed; z-index: 1;
    top: calc(22px + env(safe-area-inset-top, 0px));
    left: calc(var(--gl) + 12px);
    display: grid; gap: 2px; justify-items: start;
    animation: rise .9s var(--ease) both .3s;
  }
  #clock {
    font: 200 56px/1 var(--display);
    letter-spacing: -.01em;
    font-variant-numeric: tabular-nums;
  }
  #date { font-size: 14px; color: var(--paper-dim); margin-top: 10px; }
  #coords { font: 400 12px var(--mono); color: var(--paper-dim); letter-spacing: .06em; }
  #place {
    font-size: 15px; color: var(--paper);
    border-bottom: 1px solid var(--paper-faint);
    padding: 4px 0 2px; margin-top: 2px;
    transition: border-color .2s;
  }
  #place:hover { border-color: var(--paper); }
  #back-now {
    margin-top: 12px; padding: 6px 12px;
    font-size: 13px; font-weight: 600;
    color: var(--on-paper); background: var(--paper);
    animation: rise .4s var(--ease) both;
  }

  /* The control strip. */
  .strip {
    position: fixed; z-index: 2;
    left: 0; right: 0; bottom: 0;
    padding: 0 calc(var(--gr) + 8px) calc(var(--gb) + 10px) calc(var(--gl) + 8px);
    display: flex; align-items: stretch; flex-wrap: wrap; row-gap: 4px;
    border-top: 1px solid var(--paper-faint);
    animation: rise .9s var(--ease) both .45s;
  }
  .group { display: flex; align-items: stretch; }
  .group + .group { border-left: 1px solid var(--paper-faint); margin-left: 8px; padding-left: 8px; }
  .group.end { margin-left: auto; border-left: 0; }
  .ctl {
    position: relative;
    min-height: 60px; padding: 0 16px;
    font-size: 15px; color: var(--paper-dim);
    white-space: nowrap;
    transition: color .2s;
  }
  .ctl:hover { color: var(--paper); }
  /* On state: full-strength text and a rule drawn across the top edge of the strip. */
  .ctl::after {
    content: ""; position: absolute; left: 16px; right: 16px; top: -1px; height: 2px;
    background: var(--paper);
    transform: scaleX(0); transition: transform .35s var(--ease);
  }
  .ctl.on { color: var(--paper); }
  .ctl.on::after { transform: scaleX(1); }
  .ctl.lead { font: 500 19px var(--display); color: var(--paper); padding-left: 4px; }
  .ctl .num { font-family: var(--mono); font-size: 14px; }
  .demo { font-size: 12px; color: var(--paper-dim); text-decoration: underline; text-underline-offset: 3px; padding: 0 4px; align-self: center; }

  #daylight {
    position: fixed; z-index: 2; left: 50%; top: calc(30px + env(safe-area-inset-top, 0px));
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 18px;
    padding: 10px 10px 10px 18px;
    background: var(--sheet); border: 1px solid var(--paper-faint);
    max-width: calc(100% - var(--gl) - var(--gr));
    animation: rise .6s var(--ease) both;
  }
  #daylight .primary { min-height: 40px; padding: 0 16px; font-size: 14px; }

  /* Detail sheet. */
  #panel {
    position: fixed; z-index: 3;
    top: 0; right: 0;
    bottom: calc(71px + var(--gb));
    width: min(440px, 100%);
    padding: calc(28px + env(safe-area-inset-top, 0px)) calc(var(--gr) + 12px) 22px 32px;
    display: flex; flex-direction: column; gap: 10px;
    background: var(--sheet);
    border-left: 1px solid var(--paper-faint);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    animation: sheet-in .5s var(--ease) both;
  }
  @keyframes sheet-in { from { transform: translateX(40px); opacity: 0; } }
  @keyframes rise { from { transform: translateY(10px); opacity: 0; } }
  #panel > * { animation: rise .55s var(--ease) both; }
  #panel > :nth-child(2) { animation-delay: .06s; }
  #panel > :nth-child(3) { animation-delay: .12s; }
  #panel > :nth-child(4) { animation-delay: .18s; }
  #panel-subtitle {
    order: -1; margin: 0;
    font-size: 13px; line-height: 1.6; color: var(--paper-dim); letter-spacing: .02em;
  }
  .panel-head { display: flex; align-items: flex-start; gap: 16px; }
  #panel-title {
    flex: 1; margin: 0;
    font: 300 34px/1.2 var(--display);
    letter-spacing: -.01em; text-wrap: balance;
  }
  #panel-close {
    flex: none; width: 44px; height: 44px; margin: -4px -8px 0 0;
    font-size: 22px; font-weight: 200; color: var(--paper-dim);
    transition: color .2s, transform .3s var(--ease);
  }
  #panel-close:hover { color: var(--paper); transform: rotate(90deg); }
  #panel-body {
    margin: 6px 0 0; flex: 1; min-height: 0; overflow-y: auto;
    white-space: pre-line; font-size: 16px; line-height: 1.8; color: var(--paper);
    padding-top: 14px; border-top: 1px solid var(--paper-faint);
  }
  #panel-body.story { font: 300 20px/1.95 var(--display); }
  #panel-body.turn { animation: page .5s var(--ease); }
  @keyframes page { from { opacity: 0; transform: translateX(12px); } }
  #panel-actions { display: flex; flex-direction: column; gap: 8px; }
  #panel-actions .row { display: flex; gap: 8px; }
  #panel-actions .row > * { flex: 1; min-width: 0; }

  .primary {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    min-height: 60px; padding: 0 20px;
    background: var(--paper); color: var(--on-paper);
    font-size: 16px; font-weight: 600; letter-spacing: .01em;
    transition: transform .15s;
  }
  .primary:active { transform: scale(.985); }
  /* While reading aloud, three bars move beside the label. */
  .primary.speaking::before {
    content: ""; width: 16px; height: 16px; flex: none;
    background:
      linear-gradient(currentColor, currentColor) 0 100% / 3px 40% no-repeat,
      linear-gradient(currentColor, currentColor) 6px 100% / 3px 100% no-repeat,
      linear-gradient(currentColor, currentColor) 12px 100% / 3px 60% no-repeat;
    animation: bars .9s ease-in-out infinite;
  }
  @keyframes bars {
    33% { background-size: 3px 100%, 3px 35%, 3px 80%; }
    66% { background-size: 3px 55%, 3px 75%, 3px 30%; }
  }
  .ghost {
    min-height: 54px; padding: 0 16px;
    border: 1px solid var(--paper-faint); font-size: 15px;
    transition: border-color .2s;
  }
  .ghost:hover { border-color: var(--paper); }
  #panel-actions .item {
    display: grid; grid-template-columns: 1fr auto; align-items: baseline; column-gap: 12px;
    padding: 16px 0; text-align: left;
    border-bottom: 1px solid var(--paper-faint);
  }
  #panel-actions .item:first-child { border-top: 1px solid var(--paper-faint); }
  #panel-actions .item b { font: 300 23px/1.3 var(--display); }
  #panel-actions .item span { font-size: 13px; color: var(--paper-dim); }
  #panel-actions .item::after {
    content: "→"; grid-column: 2; grid-row: 1; color: var(--paper-dim);
    transform: translateX(-6px); opacity: 0; transition: transform .3s var(--ease), opacity .3s;
  }
  #panel-actions .item:hover::after { transform: none; opacity: 1; }
  #panel-actions .item span { grid-column: 1; }

  #driving {
    position: fixed; inset: 0; z-index: 5;
    display: grid; place-content: center; justify-items: center; gap: 24px;
    padding: 24px; text-align: center; background: rgba(4, 6, 12, .96);
    animation: fade .4s both;
  }
  @keyframes fade { from { opacity: 0; } }
  #driving p { margin: 0; max-width: 22ch; font: 300 30px/1.5 var(--display); }
  #driving .gear { font: 400 12px var(--mono); letter-spacing: .3em; color: var(--paper-dim); }
  #driving .primary { padding: 0 28px; }

  #toast {
    position: fixed; z-index: 4; left: 50%; bottom: calc(90px + var(--gb));
    transform: translateX(-50%);
    width: max-content; max-width: min(620px, calc(100% - 32px));
    padding: 12px 18px; background: var(--sheet); border: 1px solid var(--paper-faint);
    font-size: 14px; text-align: center;
    animation: rise .35s var(--ease) both;
  }

  @media (max-width: 900px) {
    #clock { font-size: 40px; }
    .shade { width: 340px; height: 200px; }
    .shade.bottom { height: 230px; }
    .group + .group { margin-left: 0; padding-left: 0; border-left: 0; }
    .group.end { margin-left: 0; }
    .strip { justify-content: space-between; }
    .ctl { min-height: 48px; padding: 0 10px; font-size: 14px; }
    .ctl::after { left: 10px; right: 10px; }
    .ctl.lead { font-size: 17px; }
    #panel {
      top: auto; left: 0; width: auto; max-height: 72%;
      bottom: 0;
      padding: 22px calc(var(--gr) + 4px) calc(var(--gb) + 18px) calc(var(--gl) + 4px);
      border-left: 0; border-top: 1px solid var(--paper-faint);
      animation-name: sheet-up;
    }
    @keyframes sheet-up { from { transform: translateY(30px); opacity: 0; } }
    #panel-title { font-size: 26px; }
    #panel-body.story { font-size: 18px; }
    #toast { bottom: calc(124px + var(--gb)); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    #sky { opacity: 1; }
  }
</style>

<canvas id="sky" aria-label="지금 이 자리의 밤하늘. 끌어서 둘러보고, 휠이나 두 손가락으로 확대하고, 별을 눌러 보세요."></canvas>
<div id="loading">하늘을 그리는 중</div>
<div class="shade" aria-hidden="true"></div>
<div class="shade bottom" aria-hidden="true"></div>

<section class="when" aria-live="polite">
  <div id="clock">--:--</div>
  <div id="date"></div>
  <div id="coords"></div>
  <button id="place" type="button">영양 국제밤하늘보호공원</button>
  <button id="back-now" type="button" hidden>시간 이동 중 · 지금으로</button>
</section>

<div id="daylight" hidden>
  <span>지금은 하늘이 밝아서 별이 잘 안 보여요</span>
  <button class="primary" id="tonight" type="button">오늘 밤 9시 하늘</button>
</div>

<nav class="strip" aria-label="조작">
  <div class="group">
    <button class="ctl lead" id="stories" type="button">별자리 이야기</button>
  </div>
  <div class="group" role="group" aria-label="시간">
    <button class="ctl" id="minus" type="button"><span class="num">−1</span>시간</button>
    <button class="ctl" id="plus" type="button"><span class="num">+1</span>시간</button>
    <button class="ctl" id="play" type="button">빠르게</button>
  </div>
  <div class="group" role="group" aria-label="보기">
    <button class="ctl on" id="seg-windshield" type="button" aria-pressed="true">앞유리</button>
    <button class="ctl" id="seg-sunroof" type="button" aria-pressed="false">선루프</button>
    <button class="ctl" id="lines" type="button" aria-pressed="false">별자리 선</button>
    <button class="ctl" id="art" type="button" aria-pressed="false">별자리 그림</button>
    <button class="ctl" id="night" type="button" aria-pressed="false">관측 모드</button>
  </div>
  <div class="group end">
    <button class="demo" id="drive" type="button">웹 데모 · 주행 시작해 보기</button>
  </div>
</nav>

<aside id="panel" hidden>
  <div class="panel-head">
    <h2 id="panel-title"></h2>
    <button id="panel-close" type="button" aria-label="닫기">×</button>
  </div>
  <p id="panel-subtitle"></p>
  <p id="panel-body"></p>
  <div id="panel-actions"></div>
</aside>

<div id="toast" role="status" hidden></div>

<div id="driving" hidden>
  <span class="gear">GEAR D · 주행 중</span>
  <p>운전 중에는 별을 볼 수 없어요. 차를 세우면 보던 하늘을 이어서 보여 드릴게요.</p>
  <button class="primary" id="park" type="button">정차하기 (기어 P)</button>
</div>

<script src="byeolmajung.js" charset="utf-8"></script>
