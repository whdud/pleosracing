<meta charset="utf-8">
<title>별마중</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
  /* Layout: one screen like an in-car display. The sky fills it; controls float over the sky:
     status chip top-left, control bar along the bottom, a side panel on the right (bottom sheet on phones). */
  :root {
    color-scheme: dark;
    --night: #05070d;          /* sky and page ground */
    --glass: rgba(11, 16, 32, 0.82);
    --glass-strong: rgba(13, 20, 38, 0.94);
    --ink: #e4ecf7;            /* text */
    --ink-dim: #9db0cc;
    --starlight: #ffd36b;      /* accent: the highlighted-constellation gold */
    --button: #1b2640;
    --button-hover: #253354;
    --line: rgba(143, 166, 204, 0.22);
    --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --font-story: "Gowun Batang", "AppleMyungjo", "Batang", serif;
    --radius: 18px;
    --edge-l: max(16px, env(safe-area-inset-left, 0px));
    --edge-r: max(16px, env(safe-area-inset-right, 0px));
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--night);
    color: var(--ink);
    font: 16px/1.5 var(--font-ui);
    padding-left: var(--edge-l);
    padding-right: var(--edge-r);
    -webkit-tap-highlight-color: transparent;
  }
  #sky {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: grab;
  }
  #sky:active { cursor: grabbing; }

  .chip {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top, 0px));
    left: var(--edge-l);
    max-width: calc(100% - var(--edge-l) - var(--edge-r));
    padding: 8px 16px;
    border-radius: 999px;
    background: var(--glass);
    color: var(--ink);
    font-size: 15px;
    letter-spacing: 0.01em;
    font-variant-numeric: tabular-nums;
    backdrop-filter: blur(6px);
  }
  .demo-tag {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top, 0px));
    right: var(--edge-r);
    padding: 6px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--ink-dim);
    font-size: 12px;
    letter-spacing: 0.06em;
    background: var(--glass);
  }

  #daylight {
    position: fixed;
    top: calc(64px + env(safe-area-inset-top, 0px));
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 14px;
    align-items: center;
    padding: 8px 8px 8px 18px;
    border-radius: var(--radius);
    background: var(--glass-strong);
    max-width: calc(100% - var(--edge-l) - var(--edge-r));
  }

  .bar {
    position: fixed;
    left: var(--edge-l);
    right: var(--edge-r);
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    display: flex;
    justify-content: center;
  }
  .bar-inner {
    display: flex;
    gap: 8px;
    padding: 8px;
    border-radius: calc(var(--radius) + 6px);
    background: var(--glass);
    backdrop-filter: blur(6px);
    overflow-x: auto;
    max-width: 100%;
    scrollbar-width: none;
  }
  .bar-inner::-webkit-scrollbar { display: none; }
  .divider { width: 1px; align-self: stretch; margin: 6px 2px; background: var(--line); flex: none; }

  .btn {
    flex: none;
    min-height: 56px;
    min-width: 88px;
    padding: 0 18px;
    border: 0;
    border-radius: var(--radius);
    background: var(--button);
    color: var(--ink);
    font: 500 16px var(--font-ui);
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { background: var(--button-hover); }
  .btn:focus-visible { outline: 2px solid var(--starlight); outline-offset: 2px; }
  .btn.secondary { background: transparent; border: 1px solid var(--line); }
  .btn.drive { color: var(--ink-dim); }

  #panel {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top, 0px));
    right: var(--edge-r);
    bottom: calc(104px + env(safe-area-inset-bottom, 0px));
    width: min(440px, calc(100% - var(--edge-l) - var(--edge-r)));
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 24px;
    box-sizing: border-box;
    border-radius: calc(var(--radius) + 6px);
    background: var(--glass-strong);
    backdrop-filter: blur(10px);
  }
  #panel-title {
    margin: 0;
    font: 700 28px/1.25 var(--font-ui);
    text-wrap: balance;
  }
  #panel-subtitle { margin: 0; color: var(--starlight); font-size: 14px; letter-spacing: 0.02em; }
  #panel-body {
    margin: 4px 0 0;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    white-space: pre-line;
    font-size: 18px;
    line-height: 1.7;
  }
  #panel-body.story { font: 400 21px/1.85 var(--font-story); }
  #panel-actions { display: flex; flex-direction: column; gap: 8px; margin-top: auto; }
  #panel-actions .btn { width: 100%; }
  #panel-actions .row { display: flex; gap: 8px; }
  #panel-actions .row .btn { flex: 1; min-width: 0; }

  #driving {
    position: fixed;
    inset: 0;
    display: grid;
    place-content: center;
    gap: 20px;
    padding: 24px var(--edge-r) 24px var(--edge-l);
    text-align: center;
    background: rgba(0, 0, 0, 0.94);
    font-size: 24px;
    line-height: 1.6;
  }
  #driving p { margin: 0; max-width: 34ch; }
  #driving .gear { font-size: 13px; letter-spacing: 0.2em; color: var(--ink-dim); }

  #toast {
    position: fixed;
    left: 50%;
    bottom: calc(100px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    width: max-content;
    max-width: min(640px, calc(100% - var(--edge-l) - var(--edge-r)));
    padding: 12px 18px;
    border-radius: 14px;
    background: var(--glass-strong);
    font-size: 15px;
    text-align: center;
  }
  #loading {
    position: fixed;
    inset: 0;
    display: grid;
    place-content: center;
    color: var(--ink-dim);
    letter-spacing: 0.04em;
  }

  @media (max-width: 720px) {
    .chip { font-size: 13px; padding: 6px 12px; }
    .demo-tag { display: none; }
    .btn { min-height: 48px; min-width: 72px; padding: 0 14px; font-size: 14px; }
    .bar { justify-content: flex-start; }
    #panel {
      top: auto;
      left: var(--edge-l);
      right: var(--edge-r);
      width: auto;
      bottom: calc(86px + env(safe-area-inset-bottom, 0px));
      max-height: 58%;
      padding: 18px;
    }
    #panel-title { font-size: 22px; }
    #panel-body.story { font-size: 18px; }
    #daylight { flex-direction: column; align-items: stretch; text-align: center; padding: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { scroll-behavior: auto; }
  }
</style>

<canvas id="sky" aria-label="지금 이 자리의 밤하늘. 끌어서 둘러보고, 휠이나 두 손가락으로 확대하고, 별을 눌러 보세요."></canvas>
<div id="loading">하늘을 그리는 중…</div>

<div class="chip" id="status" aria-live="polite">영양 국제밤하늘보호공원</div>
<div class="demo-tag">PLEOS CONNECT · 웹 데모</div>

<div id="daylight" hidden>
  <span>지금은 하늘이 밝아서 별이 잘 안 보여요</span>
  <button class="btn" id="tonight" type="button">오늘 밤 9시 하늘 보기</button>
</div>

<nav class="bar" aria-label="조작">
  <div class="bar-inner">
    <button class="btn" id="now" type="button">지금</button>
    <button class="btn" id="minus" type="button">−1시간</button>
    <button class="btn" id="plus" type="button">+1시간</button>
    <button class="btn" id="play" type="button">▶ 빠르게</button>
    <span class="divider"></span>
    <button class="btn" id="mode" type="button">선루프 보기</button>
    <button class="btn" id="night" type="button">관측 모드</button>
    <button class="btn" id="lines" type="button">별자리 선</button>
    <button class="btn" id="stories" type="button">별자리 이야기</button>
    <button class="btn" id="place" type="button">장소</button>
    <span class="divider"></span>
    <button class="btn drive" id="drive" type="button">주행 시작해 보기</button>
  </div>
</nav>

<aside id="panel" hidden>
  <h2 id="panel-title"></h2>
  <p id="panel-subtitle"></p>
  <p id="panel-body"></p>
  <div id="panel-actions"></div>
</aside>

<div id="toast" role="status" hidden></div>

<div id="driving" hidden>
  <span class="gear">기어 D · 주행 중</span>
  <p>운전 중에는 별을 볼 수 없어요.<br>안전한 곳에 차를 세우면 보던 하늘을 이어서 보여 드릴게요.</p>
  <div><button class="btn" id="park" type="button">정차하기 (기어 P)</button></div>
</div>

<script src="byeolmajung.js" charset="utf-8"></script>
